<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AegiFit-Icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#f5f6fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <script>
      // Aplica el tema guardado antes del primer paint (sin FOUC).
      // Claro por defecto; "dark" solo si el usuario lo eligió.
      (function () {
        var theme = "light";
        try {
          if (localStorage.getItem("aegi-theme") === "dark") theme = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
        if (theme === "dark") {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#101118");
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/AegiFit-Icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24..48,400..700,0..1,0&display=swap"
      rel="stylesheet"
    />
    <title>AegiFitness</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
