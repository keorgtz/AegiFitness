# AegiFitness — Nginx (SPA PWA + proxy inverso a la API)
#
# Importante: NO usar bloque `upstream` ni proxy_pass directo a `api:8080`.
# Nginx resuelve el DNS del upstream una sola vez al arrancar; si el
# contenedor `api` se reinicia o se recrea con otra IP interna, el proxy
# queda apuntando a una IP muerta (502 permanente). Con `resolver` +
# variable, el DNS de Docker (127.0.0.11) se consulta en cada request.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
    gzip_min_length 1024;

    # ── API → contenedor api (DNS dinámico) ──
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $aegifit_api http://api:8080;
        proxy_pass $aegifit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # ── Healthcheck del contenedor web ──
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── Service worker: nunca cachear ──
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── Assets con hash: cache larga ──
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ──
    location / {
        try_files $uri $uri/ /index.html;
    }
}
